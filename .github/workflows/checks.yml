# Runs the project's checks on every pull request and on pushes to the
# main development branches. See DEC-011 in docs/decisions.md.
name: Checks

on:
  pull_request:
  push:
    branches: [wf-dev-1, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: npm run build
      - name: Tests
        run: node --test
